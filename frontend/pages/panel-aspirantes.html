<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Aspirantes</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 { text-align: center; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }

    th {
      background: #333;
      color: #fff;
      text-transform: uppercase;
      font-size: 14px;
    }

    td, th {
      padding: 10px;
      text-align: center;
      border: 1px solid #ddd;
    }

    tr:nth-child(even) { background: #f9f9f9; }

    button {
      background: #c0392b;
      color: white;
      border: none;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover { background: #e74c3c; }

    select {
      padding: 5px;
      border-radius: 4px;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
    }

    .modal-contenido {
      background: white;
      margin: 8% auto;
      padding: 25px;
      width: 90%;
      max-width: 600px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      text-align: center;
    }

    .cerrar-modal {
      float: right;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      color: #c0392b;
    }

    .historial-item {
      text-align: left;
      background: #f4f4f4;
      margin: 10px 0;
      padding: 12px;
      border-left: 5px solid #333;
      border-radius: 6px;
    }

    .btn-cancelar {
      background: #7f8c8d;
      margin-right: 10px;
    }

    .btn-cancelar:hover { background: #95a5a6; }

    .btn-eliminar {
      background: #c0392b;
    }

    .btn-eliminar:hover { background: #e74c3c; }
  </style>
</head>

<body>

  <h1>Panel de Aspirantes</h1>
  <p>Solicitudes recibidas desde el formulario.</p>

  <div id="resumen" style="text-align:center; margin:20px 0; font-weight:bold;"></div>

  <p style="text-align:center; margin-bottom:20px;">
    <a href="../index.html">← Volver al inicio</a>
  </p>

  <div id="lista-aspirantes"></div>

  <!-- Modal historial -->
  <div id="modalHistorial" class="modal">
    <div class="modal-contenido">
      <span class="cerrar-modal" onclick="cerrarModalHistorial()">&times;</span>
      <h2 id="tituloHistorial">Historial del Aspirante</h2>
      <div id="contenidoHistorial"></div>
    </div>
  </div>

  <!-- Modal eliminar -->
  <div id="modalEliminar" class="modal">
    <div class="modal-contenido">
      <span class="cerrar-modal" onclick="cerrarModalEliminar()">&times;</span>
      <h2>Confirmar eliminación</h2>
      <p id="textoEliminar">¿Seguro que deseas eliminar este aspirante?</p>

      <button class="btn-cancelar" onclick="cerrarModalEliminar()">Cancelar</button>
      <button class="btn-eliminar" onclick="confirmarEliminar()">Sí, eliminar</button>
    </div>
  </div>

  <script>
    const logueado = localStorage.getItem("adminLogueado");

    let aspiranteAEliminar = null;

    if (logueado !== "true") {
      alert("Acceso no autorizado");
      window.location.href = "login.html";
    }

    async function cargarAspirantes() {
      const contenedor = document.getElementById("lista-aspirantes");

      try {
        const respuesta = await fetch("/api/aspirantes");
        const aspirantes = await respuesta.json();

        const total = aspirantes.length;
        const nuevos = aspirantes.filter(a => (a.estado || "Nuevo") === "Nuevo").length;
        const enProceso = aspirantes.filter(a => a.estado === "En proceso").length;
        const aprobados = aspirantes.filter(a => a.estado === "Aprobado").length;
        const rechazados = aspirantes.filter(a => a.estado === "Rechazado").length;

        document.getElementById("resumen").innerHTML = `
          Total: ${total} |
          Nuevos: ${nuevos} |
          En proceso: ${enProceso} |
          Aprobados: ${aprobados} |
          Rechazados: ${rechazados}
        `;

        if (aspirantes.length === 0) {
          contenedor.innerHTML = "<p>No hay aspirantes registrados.</p>";
          return;
        }

        const ordenEstados = {
          "Nuevo": 1,
          "Contactado": 2,
          "En proceso": 3,
          "Aprobado": 4,
          "Rechazado": 5
        };

        aspirantes.sort((a, b) => {
          return ordenEstados[a.estado || "Nuevo"] - ordenEstados[b.estado || "Nuevo"];
        });

        contenedor.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th>Fecha</th>
                <th>Estado</th>
                <th>Historial</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody>
              ${aspirantes.map((a, i) => `
                <tr>
                  <td>${i + 1}</td>
                  <td>${a.nombre}</td>
                  <td>${a.edad}</td>
                  <td>${a.telefono}</td>
                  <td>${a.email}</td>
                  <td>${new Date(a.timestamp).toLocaleString()}</td>
                  <td>
                    <select onchange="actualizarEstado(${a.id}, this.value)">
                      <option value="Nuevo" ${a.estado === "Nuevo" ? "selected" : ""}>Nuevo</option>
                      <option value="Contactado" ${a.estado === "Contactado" ? "selected" : ""}>Contactado</option>
                      <option value="En proceso" ${a.estado === "En proceso" ? "selected" : ""}>En proceso</option>
                      <option value="Aprobado" ${a.estado === "Aprobado" ? "selected" : ""}>Aprobado</option>
                      <option value="Rechazado" ${a.estado === "Rechazado" ? "selected" : ""}>Rechazado</option>
                    </select>
                  </td>
                  <td>
                    <button onclick="verHistorial(${a.id})">📜 Ver historial</button>
                  </td>
                  <td>
                    <button onclick="abrirModalEliminar(${a.id}, '${a.nombre.replace(/'/g, "\\'")}')">❌ Eliminar</button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;

      } catch {
        contenedor.innerHTML = "<p>Error al cargar los aspirantes.</p>";
      }
    }

    async function actualizarEstado(id, estado) {
      await fetch(`/api/aspirantes/${id}/estado`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ estado })
      });

      cargarAspirantes();
    }

    function abrirModalEliminar(id, nombre) {
      aspiranteAEliminar = id;
      document.getElementById("textoEliminar").textContent =
        `¿Seguro que deseas eliminar a ${nombre}? Esta acción no se puede deshacer.`;
      document.getElementById("modalEliminar").style.display = "block";
    }

    function cerrarModalEliminar() {
      aspiranteAEliminar = null;
      document.getElementById("modalEliminar").style.display = "none";
    }

    async function confirmarEliminar() {
      if (!aspiranteAEliminar) return;

      await fetch(`/api/aspirantes/${aspiranteAEliminar}`, {
        method: "DELETE"
      });

      cerrarModalEliminar();
      cargarAspirantes();
    }

    async function verHistorial(id) {
      const res = await fetch("/api/aspirantes");
      const data = await res.json();
      const a = data.find(x => x.id === id);

      document.getElementById("tituloHistorial").textContent = `Historial de ${a.nombre}`;

      document.getElementById("contenidoHistorial").innerHTML =
        a.historialEstados.map(h => `
          <div class="historial-item">
            <strong>${h.estado}</strong><br>
            ${new Date(h.fecha).toLocaleString()}<br>
            ${h.nota}
          </div>
        `).join("");

      document.getElementById("modalHistorial").style.display = "block";
    }

    function cerrarModalHistorial() {
      document.getElementById("modalHistorial").style.display = "none";
    }

    window.onclick = function(e) {
      if (e.target.id === "modalHistorial") cerrarModalHistorial();
      if (e.target.id === "modalEliminar") cerrarModalEliminar();
    };

    cargarAspirantes();
  </script>

</body>
</html>
